[graph]
all-features = true

[advisories]
# unmaintained crates pulled in transitively by substrate tooling are warnings, not errors
unmaintained = "workspace"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "Unicode-3.0", "CDLA-Permissive-2.0", "ISC", "Zlib", "CC0-1.0", "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
